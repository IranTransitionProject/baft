# Baft ITP MCP Gateway — Local (no NATS required)
#
# Workshop tools, session management, DuckDB queries, and council tools
# for local Claude chat sessions without infrastructure.
#
# Run with:
#   heddle mcp --config configs/mcp/itp_local.yaml --skip-preflight
#   heddle mcp --config configs/mcp/itp_local.yaml --transport streamable-http --port 8765 --skip-preflight

name: "baft-local"
description: "ITP analytical engine — local tools (workshop, sessions, entities, council)"

tools:
  # DuckDB entity queries — runs in-process (no NATS needed)
  queries:
    - backend: "heddle.contrib.duckdb.query_backend.DuckDBQueryBackend"
      actions: ["search", "filter", "stats", "get"]
      name_prefix: "entities"
      backend_config:
        db_path: "itp-workspace/itp.duckdb"
        table_name: "entities"
        result_columns:
          - "id"
          - "type"
          - "title"
          - "status"
          - "epistemic_tag"
          - "confidence"
          - "updated_date"
        id_column: "id"
        full_text_column: "content"
        fts_fields: "title,content,tags"
        filter_fields:
          entity_type: "type = ?"
          status: "status = ?"
          confidence: "confidence = ?"
        stats_groups: ["type", "status", "epistemic_tag"]
        stats_aggregates:
          - "COUNT(*) AS count"
          - "COUNT(CASE WHEN status='active' THEN 1 END) AS active_count"

  # Workshop tools — worker CRUD, test bench, eval, impact analysis
  workshop:
    configs_dir: "configs/"
    apps_dir: "~/.heddle/apps/"
    enable:
      - worker
      - test
      - eval
      - impact
      - deadletter

  # Session management — framework git ops, DuckDB sync
  session:
    enable:
      - start
      - end
      - status
      - sync_check
      - sync

  # Council deliberation — multi-agent discussions
  council:
    configs_dir: "configs/councils"
    enable:
      - start
      - status
      - transcript
      - intervene
      - stop

resources:
  workspace_dir: "${ITP_ROOT}/baseline/data"
  patterns:
    - "variables.yaml"
    - "observations.yaml"
    - "scenarios.yaml"
    - "traps.yaml"
    - "gaps.yaml"
    - "modules.yaml"
    - "sessions.yaml"
