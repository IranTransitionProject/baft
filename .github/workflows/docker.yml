name: Build container images

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag (e.g. v0.3.0)"
        required: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/irantransitionproject

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image:
          - name: baft-worker
            dockerfile: docker/Dockerfile.worker
          - name: baft-router
            dockerfile: docker/Dockerfile.router
          - name: baft-pipeline
            dockerfile: docker/Dockerfile.pipeline
          - name: baft-workshop
            dockerfile: docker/Dockerfile.workshop
          - name: baft-mcp
            dockerfile: docker/Dockerfile.mcp
          - name: baft-import
            dockerfile: docker/Dockerfile.import
          - name: baft-commit-agent
            dockerfile: docker/Dockerfile.commit-agent
    steps:
      - uses: actions/checkout@v4

      - name: Checkout loom
        uses: actions/checkout@v4
        with:
          repository: IranTransitionProject/loom
          path: loom

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image.dockerfile }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}:${{ steps.tag.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.image.name }}:latest
