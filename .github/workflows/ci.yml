name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint-md:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rvben/rumdl@v0
        with:
          report-type: annotations

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: getheddle/heddle
          path: heddle
      - uses: astral-sh/setup-uv@v5
      - run: ln -s $GITHUB_WORKSPACE/heddle $GITHUB_WORKSPACE/../heddle
      - run: uv sync --extra dev
      - name: Ruff lint
        run: uv run ruff check scripts/ pipeline/scripts/ tests/
      - name: Ruff format check
        run: uv run ruff format --check scripts/ pipeline/scripts/ tests/

  schemas-check:
    # Verify baft-schemas/v1/ on disk matches what baft.contracts produces.
    # Mirrors heddle's tools/export_schemas.py --check job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: getheddle/heddle
          path: heddle
      - uses: astral-sh/setup-uv@v5
      - run: ln -s $GITHUB_WORKSPACE/heddle $GITHUB_WORKSPACE/../heddle
      - run: uv sync --extra dev
      - name: Check baft schemas
        run: uv run python tools/export_baft_schemas.py --check

  typecheck:
    # Pyright in strict-minus-Unknowns mode on baft's first-party Python.
    # Mirrors heddle v0.9.2's gated-strict pattern.  Fails on errors only;
    # the four Unknown-type rules and missing-type-stubs are deferred to
    # warning until each boundary (yaml/json/http) has a typed wrapper.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: getheddle/heddle
          path: heddle
      - uses: astral-sh/setup-uv@v5
      - run: ln -s $GITHUB_WORKSPACE/heddle $GITHUB_WORKSPACE/../heddle
      - run: uv sync --extra dev
      - name: Pyright
        run: uv run --with pyright pyright

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: getheddle/heddle
          path: heddle
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: ln -s $GITHUB_WORKSPACE/heddle $GITHUB_WORKSPACE/../heddle
      - name: Install dependencies
        run: uv sync --extra dev
      - name: Run tests with coverage
        run: |
          uv run pytest tests/ -v -m "not integration and not e2e" \
            --cov --cov-report=term-missing --cov-report=xml

      - name: Upload coverage to Codecov
        if: matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage.xml
          fail_ci_if_error: false
