apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: framework-data
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "baft.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.framework.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: framework-sync
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "baft.labels" . | nindent 4 }}
    app.kubernetes.io/name: framework-sync
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: framework-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: framework-sync
    spec:
      initContainers:
        - name: git-clone
          image: registry.k8s.io/git-sync/git-sync:v4
          args:
            - "--repo={{ .Values.framework.repo }}"
            - "--ref={{ .Values.framework.branch }}"
            - "--root=/data/framework"
            - "--one-time"
          volumeMounts:
            - name: framework-data
              mountPath: /data/framework
          {{- if .Values.framework.sshKeySecret }}
          env:
            - name: GIT_SYNC_SSH_KEY_FILE
              value: /etc/git-secret/id_rsa
          volumeMounts:
            - name: git-secret
              mountPath: /etc/git-secret
              readOnly: true
          {{- end }}
      containers:
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4
          args:
            - "--repo={{ .Values.framework.repo }}"
            - "--ref={{ .Values.framework.branch }}"
            - "--root=/data/framework"
            - "--period={{ .Values.framework.syncInterval }}s"
          volumeMounts:
            - name: framework-data
              mountPath: /data/framework
          {{- if .Values.framework.sshKeySecret }}
          env:
            - name: GIT_SYNC_SSH_KEY_FILE
              value: /etc/git-secret/id_rsa
          {{- end }}
        {{- if .Values.framework.commitAgent.enabled }}
        - name: commit-agent
          image: alpine/git:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                sleep {{ .Values.framework.commitAgent.interval }}
                cd /data/framework
                git add -A
                if ! git diff --cached --quiet; then
                  git commit -m "{{ .Values.framework.commitAgent.message }} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  git push || echo "Push failed — will retry next cycle"
                fi
              done
          volumeMounts:
            - name: framework-data
              mountPath: /data/framework
        {{- end }}
      volumes:
        - name: framework-data
          persistentVolumeClaim:
            claimName: framework-data
        {{- if .Values.framework.sshKeySecret }}
        - name: git-secret
          secret:
            secretName: {{ .Values.framework.sshKeySecret }}
            defaultMode: 0400
        {{- end }}
