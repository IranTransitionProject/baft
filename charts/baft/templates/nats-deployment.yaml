apiVersion: apps/v1
kind: Deployment
metadata:
  name: nats
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "baft.labels" . | nindent 4 }}
    app.kubernetes.io/name: nats
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nats
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nats
    spec:
      containers:
        - name: nats
          image: {{ .Values.nats.image }}
          ports:
            - containerPort: 4222
              name: client
            {{- if .Values.nats.monitoring }}
            - containerPort: 8222
              name: monitoring
            {{- end }}
          {{- if .Values.nats.monitoring }}
          args: ["-m", "8222"]
          {{- end }}
          readinessProbe:
            tcpSocket:
              port: 4222
            initialDelaySeconds: 2
            periodSeconds: 5
