apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: baseline-data
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "baft.labels" . | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.baseline.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: baseline-sync
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "baft.labels" . | nindent 4 }}
    app.kubernetes.io/name: baseline-sync
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: baseline-sync
  template:
    metadata:
      labels:
        app.kubernetes.io/name: baseline-sync
    spec:
      initContainers:
        - name: git-clone
          image: registry.k8s.io/git-sync/git-sync:v4
          args:
            - "--repo={{ .Values.baseline.repo }}"
            - "--ref={{ .Values.baseline.branch }}"
            - "--root=/data/baseline"
            - "--one-time"
          volumeMounts:
            - name: baseline-data
              mountPath: /data/baseline
          {{- if .Values.baseline.sshKeySecret }}
          env:
            - name: GIT_SYNC_SSH_KEY_FILE
              value: /etc/git-secret/id_rsa
          volumeMounts:
            - name: git-secret
              mountPath: /etc/git-secret
              readOnly: true
          {{- end }}
      containers:
        - name: git-sync
          image: registry.k8s.io/git-sync/git-sync:v4
          args:
            - "--repo={{ .Values.baseline.repo }}"
            - "--ref={{ .Values.baseline.branch }}"
            - "--root=/data/baseline"
            - "--period={{ .Values.baseline.syncInterval }}s"
          volumeMounts:
            - name: baseline-data
              mountPath: /data/baseline
          {{- if .Values.baseline.sshKeySecret }}
          env:
            - name: GIT_SYNC_SSH_KEY_FILE
              value: /etc/git-secret/id_rsa
          {{- end }}
        {{- if .Values.baseline.commitAgent.enabled }}
        - name: commit-agent
          image: alpine/git:latest
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                sleep {{ .Values.baseline.commitAgent.interval }}
                cd /data/baseline
                git add -A
                if ! git diff --cached --quiet; then
                  git commit -m "{{ .Values.baseline.commitAgent.message }} — $(date -u +%Y-%m-%dT%H:%M:%SZ)"
                  git push || echo "Push failed — will retry next cycle"
                fi
              done
          volumeMounts:
            - name: baseline-data
              mountPath: /data/baseline
        {{- end }}
      volumes:
        - name: baseline-data
          persistentVolumeClaim:
            claimName: baseline-data
        {{- if .Values.baseline.sshKeySecret }}
        - name: git-secret
          secret:
            secretName: {{ .Values.baseline.sshKeySecret }}
            defaultMode: 0400
        {{- end }}
