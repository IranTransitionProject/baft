{{- if .Values.scheduler.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: scheduler
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "baft.labels" . | nindent 4 }}
    app.kubernetes.io/name: scheduler
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: scheduler
  template:
    metadata:
      labels:
        app.kubernetes.io/name: scheduler
    spec:
      containers:
        - name: scheduler
          image: {{ .Values.image.registry }}/baft-pipeline:{{ .Values.image.tag }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "scheduler"
            - "--config"
            - "configs/schedulers/itp.yaml"
            - "--nats-url"
            - "$(NATS_URL)"
          env:
            {{- include "baft.envVars" . | nindent 12 }}
{{- end }}
