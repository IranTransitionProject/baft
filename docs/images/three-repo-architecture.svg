<marker id="arrow_2" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 3 L 0 6 z" fill="#f59e0b"/></marker></defs>
<rect width="1200" height="550" rx="12" fill="#fafafb"/>
<text x="40" y="38" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e26" text-anchor="start" dominant-baseline="central">Baft — System Architecture</text>
<text x="40" y="62" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#888" text-anchor="start" dominant-baseline="central">Three-repo design: framework (data)  +  loom (runtime)  +  baft (application)</text>
<rect x="40" y="100" width="320" height="300" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
<text x="200" y="125" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#92400e" text-anchor="middle" dominant-baseline="central">framework/</text>
<text x="200" y="148" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#b45309" text-anchor="middle" dominant-baseline="central">ITP Analytical Database</text>
<text x="60" y="175" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#92400e" text-anchor="start">
  <tspan x="60" dy="0">YAML source of truth</tspan>
  <tspan x="60" dy="16.5"></tspan>
  <tspan x="60" dy="16.5">Entities, observations, scenarios</tspan>
  <tspan x="60" dy="16.5">Intelligence briefs</tspan>
  <tspan x="60" dy="16.5">Analytical schemas</tspan>
  <tspan x="60" dy="16.5">Constitution / epistemic rules</tspan>
  <tspan x="60" dy="16.5"></tspan>
  <tspan x="60" dy="16.5">Git-versioned, human-readable</tspan>
  <tspan x="60" dy="16.5">No code — data only</tspan>
</text>
<rect x="430" y="100" width="320" height="300" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2"/>
<text x="590" y="125" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#1e40af" text-anchor="middle" dominant-baseline="central">loom/</text>
<text x="590" y="148" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#2563eb" text-anchor="middle" dominant-baseline="central">Orchestration Framework</text>
<text x="450" y="175" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#1e40af" text-anchor="start">
  <tspan x="450" dy="0">Actor-based runtime</tspan>
  <tspan x="450" dy="16.5"></tspan>
  <tspan x="450" dy="16.5">Worker execution engine</tspan>
  <tspan x="450" dy="16.5">Pipeline orchestrator</tspan>
  <tspan x="450" dy="16.5">NATS message bus</tspan>
  <tspan x="450" dy="16.5">MCP gateway (FastMCP 3.x)</tspan>
  <tspan x="450" dy="16.5">Workshop web UI</tspan>
  <tspan x="450" dy="16.5">OpenTelemetry tracing</tspan>
  <tspan x="450" dy="16.5">CLI + TUI dashboard</tspan>
</text>
<rect x="820" y="100" width="340" height="300" rx="12" fill="#fce7f3" stroke="#ec4899" stroke-width="2"/>
<text x="990" y="125" font-family="Inter, system-ui, sans-serif" font-size="18" font-weight="700" fill="#9d174d" text-anchor="middle" dominant-baseline="central">baft/</text>
<text x="990" y="148" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#be185d" text-anchor="middle" dominant-baseline="central">ITP Application Layer</text>
<text x="840" y="175" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="400" fill="#9d174d" text-anchor="start">
  <tspan x="840" dy="0">13 worker YAML configs</tspan>
  <tspan x="840" dy="16.5"></tspan>
  <tspan x="840" dy="16.5">3 pipeline orchestrators</tspan>
  <tspan x="840" dy="16.5">5 scheduled actors</tspan>
  <tspan x="840" dy="16.5">Knowledge silo mappings</tspan>
  <tspan x="840" dy="16.5">Pydantic I/O contracts</tspan>
  <tspan x="840" dy="16.5">Session CLI + automation</tspan>
  <tspan x="840" dy="16.5">Helm chart (24 deployments)</tspan>
  <tspan x="840" dy="16.5">Pipeline config data files</tspan>
</text>
