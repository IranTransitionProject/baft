<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
<defs><marker id="arrow_1" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 3 L 0 6 z" fill="#d97520"/></marker>
<marker id="arrow_2" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 3 L 0 6 z" fill="#b5332e"/></marker>
<marker id="arrow_3" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 3 L 0 6 z" fill="#4278d9"/></marker>
<marker id="arrow_4" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 3 L 0 6 z" fill="#8b5cf6"/></marker>
<marker id="arrow_5" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="8" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 3 L 0 6 z" fill="#7c3aed"/></marker></defs>
<rect width="1200" height="900" rx="12" fill="#fafafb"/>
<text x="40" y="38" font-family="Inter, system-ui, sans-serif" font-size="26" font-weight="700" fill="#1e1e26" text-anchor="start" dominant-baseline="central">Baft — Pipeline Data Flow</text>
<text x="40" y="62" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="400" fill="#888" text-anchor="start" dominant-baseline="central">Tier 2 (standard) and Tier 3 (audit) pipeline stages with data schemas</text>
<rect x="30" y="95" width="1140" height="310" rx="10" fill="#fff7ed"/>
<text x="44" y="109" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#888" text-anchor="start" dominant-baseline="hanging">TIER 2 — STANDARD PIPELINE</text>
<rect x="50" y="130" width="200" height="60" rx="8" fill="#d97520"/>
<text x="150.0" y="160.0" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle" dominant-baseline="central">SP — Source Processor</text>
<text x="50" y="202" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#92400e" text-anchor="start">
  <tspan x="50" dy="0">Input: source_material, source_url, source_type</tspan>
  <tspan x="50" dy="12.6">Output: claims[], source_tier, epistemic_tags</tspan>
</text>
<line x1="250" y1="160" x2="310" y2="160" stroke="#d97520" stroke-width="2" marker-end="url(#arrow_1)"/>
<text x="280" y="150" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="500" fill="#d97520" text-anchor="middle" dominant-baseline="central">claims</text>
<rect x="320" y="130" width="230" height="60" rx="8" fill="#b5332e"/>
<text x="435.0" y="160.0" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle" dominant-baseline="central">IA — Intelligence Analyst</text>
<text x="320" y="202" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#991b1b" text-anchor="start">
  <tspan x="320" dy="0">Input: claims, session_id, analyst_guidance</tspan>
  <tspan x="320" dy="12.6">Output: integration_spec, new_entities,</tspan>
  <tspan x="320" dy="12.6">         updated_variables, scenarios</tspan>
</text>
<line x1="550" y1="160" x2="610" y2="160" stroke="#b5332e" stroke-width="2" marker-end="url(#arrow_2)"/>
<text x="580" y="150" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="500" fill="#b5332e" text-anchor="middle" dominant-baseline="central">spec</text>
<rect x="620" y="130" width="200" height="60" rx="8" fill="#4278d9"/>
<text x="720.0" y="160.0" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle" dominant-baseline="central">XV — Cross Validator</text>
<text x="620" y="202" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#1e40af" text-anchor="start">
  <tspan x="620" dy="0">Input: integration_spec, entity_ids</tspan>
  <tspan x="620" dy="12.6">Output: validation_result, issues[]</tspan>
</text>
<line x1="820" y1="160" x2="880" y2="160" stroke="#4278d9" stroke-width="2" marker-end="url(#arrow_3)"/>
<text x="850" y="150" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="500" fill="#4278d9" text-anchor="middle" dominant-baseline="central">valid</text>
<rect x="890" y="130" width="230" height="60" rx="8" fill="#6b7280"/>
<text x="1005.0" y="160.0" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle" dominant-baseline="central">DE — Database Engineer</text>
<text x="890" y="202" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#374151" text-anchor="start">
  <tspan x="890" dy="0">Input: integration_spec, action, session_id</tspan>
  <tspan x="890" dy="12.6">Output: changes_applied[], db_state_summary</tspan>
</text>
<rect x="50" y="250" width="1070" height="30" rx="4" fill="#fef3c7"/>
<text x="585" y="265" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="500" fill="#92400e" text-anchor="middle" dominant-baseline="central">session_id flows: IA -> XV -> DE  |  SP has no session (raw source processing)  |  DE tracks session_operation_count</text>
<text x="50" y="295" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#999" text-anchor="start">
  <tspan x="50" dy="0">Retry policy:  SP max_retries=2 (local, cheap)  |  IA max_retries=1 (frontier, expensive)  |  XV max_retries=2  |  DE max_retries=2</tspan>
</text>
<rect x="30" y="430" width="1140" height="330" rx="10" fill="#f5f3ff"/>
<text x="44" y="444" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="500" fill="#888" text-anchor="start" dominant-baseline="hanging">TIER 3 — AUDIT PIPELINE</text>
<rect x="50" y="465" width="200" height="60" rx="8" fill="#8b5cf6"/>
<text x="150.0" y="495.0" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle" dominant-baseline="central">TN — Neutralizer</text>
<text x="50" y="537" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#5b21b6" text-anchor="start">
  <tspan x="50" dy="0">Input: analytical_text, audit_id</tspan>
  <tspan x="50" dy="12.6">Output: neutralized_text, term_map</tspan>
</text>
<line x1="250" y1="495" x2="310" y2="495" stroke="#8b5cf6" stroke-width="2" marker-end="url(#arrow_4)"/>
<text x="275" y="485" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="500" fill="#8b5cf6" text-anchor="middle" dominant-baseline="central">neutral</text>
<rect x="310" y="455" width="550" height="165" rx="10" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
<text x="585" y="463" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="700" fill="#7c3aed" text-anchor="middle" dominant-baseline="central">PARALLEL GROUP  (asyncio.wait FIRST_COMPLETED)</text>
<rect x="330" y="480" width="155" height="55" rx="8" fill="#0891b2"/>
<text x="407.5" y="507.5" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#fff" text-anchor="middle" dominant-baseline="central">LA — Logic Auditor</text>
<text x="330" y="545" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="400" fill="#155e75" text-anchor="start">
  <tspan x="330" dy="0">reasoning_quality,</tspan>
  <tspan x="330" dy="11.2">logical_errors[]</tspan>
</text>
<rect x="505" y="480" width="170" height="55" rx="8" fill="#0891b2"/>
<text x="590.0" y="507.5" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#fff" text-anchor="middle" dominant-baseline="central">PA — Perspective Auditor</text>
<text x="505" y="545" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="400" fill="#155e75" text-anchor="start">
  <tspan x="505" dy="0">perspective_gaps[],</tspan>
  <tspan x="505" dy="11.2">bias_indicators[]</tspan>
</text>
<rect x="695" y="480" width="145" height="55" rx="8" fill="#dc2626"/>
<text x="767.5" y="507.5" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" fill="#fff" text-anchor="middle" dominant-baseline="central">RT — Red Teamer</text>
<text x="695" y="545" font-family="Inter, system-ui, sans-serif" font-size="8" font-weight="400" fill="#991b1b" text-anchor="start">
  <tspan x="695" dy="0">challenges[],</tspan>
  <tspan x="695" dy="11.2">vulnerability_score</tspan>
</text>
<rect x="330" y="575" width="230" height="24" rx="4" fill="#fef2f2" stroke="#fca5a5" stroke-width="1"/>
<text x="445.0" y="587.0" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#dc2626" text-anchor="middle" dominant-baseline="central">ALL BLIND — receive neutralized_text only</text>
<line x1="860" y1="507" x2="900" y2="507" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow_5)"/>
<rect x="910" y="465" width="210" height="60" rx="8" fill="#7c3aed"/>
<text x="1015.0" y="495.0" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#fff" text-anchor="middle" dominant-baseline="central">AS — Audit Synthesizer</text>
<text x="910" y="537" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#5b21b6" text-anchor="start">
  <tspan x="910" dy="0">Input: all 3 audit reports + decision_log</tspan>
  <tspan x="910" dy="12.6">Output: synthesis, consensus_score,</tspan>
  <tspan x="910" dy="12.6">         recommendations[]</tspan>
</text>
<rect x="50" y="625" width="1070" height="30" rx="4" fill="#ede9fe"/>
<text x="585" y="640" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="500" fill="#5b21b6" text-anchor="middle" dominant-baseline="central">audit_id (not session_id) — auditors have NO knowledge of which session or analyst produced the work</text>
<rect x="50" y="665" width="1070" height="45" rx="6" fill="#fff" stroke="#c4b5fd" stroke-width="1"/>
<text x="585" y="680" font-family="Inter, system-ui, sans-serif" font-size="10" font-weight="700" fill="#7c3aed" text-anchor="middle" dominant-baseline="central">PUBLICATION GATE</text>
<text x="585" y="697" font-family="Inter, system-ui, sans-serif" font-size="9" font-weight="400" fill="#666" text-anchor="middle" dominant-baseline="central">RT escalation (vulnerability_score >= threshold) blocks publication and requires human review</text>
</svg>