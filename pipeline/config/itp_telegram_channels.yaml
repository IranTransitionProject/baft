# ITP Telegram Channel Registry
# Version: 1.0 DRAFT
# Date: 2026-03-07
# Purpose: Curated list of Telegram channels for ITP intelligence collection
# Maintained by: Principal analyst (channel selection is an analytical decision)
#
# Source tier mapping:
#   1 = Official regime primary sources (KHAMENEI.IR-level)
#   2 = Semi-official / regime-affiliated media with editorial function
#   3 = Independent media, diaspora outlets with transparent sourcing
#   4 = Single-source, unverified, or agenda-driven
#   5 = Social media noise, requires heavy verification
#
# IMPORTANT: Channel handles may change. Verify handles before subscribing.
# Use Grok (SC-X) to cross-check current handles via X/Twitter crossposts.
# Use TGStat (ir.tgstat.com) to verify channel existence and subscriber counts.
#
# OPSEC NOTE: Subscribing to IRGC and regime channels from a personal Telegram
# account creates a digital footprint. Consider using a dedicated research account.

