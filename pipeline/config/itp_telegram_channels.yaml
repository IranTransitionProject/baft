# MONITORING NOTES
# ══════════════════════════════════════════════════════════════════

monitoring_notes:
  internet_shutdown_behavior: |
    During Jan 2026 internet shutdown (most extreme in Iran's history):
    - CONTINUED operating: Fars, Tasnim, Mehr, SNN, Farhikhtegan, IRIB News,
      Asr-e Iran, Supreme Leader office, Araghchi (FM)
    - WENT SILENT: Shargh, Etemad, Ham-Mihan, Khabar Online
    - PARTIAL: YJC (first few days only)

    This asymmetry is itself an analytical signal: regime channels maintain
    infrastructure access that reformist outlets do not. The silence pattern
    maps to factional power differential under stress.

  first_72_hours_war_pattern: |
    Per Factnameh analysis (2026-03-04):
    - Breaking news aggregators dominated first hours
    - Mehr News more active than Fars/Tasnim (surprising)
    - Khamenei death coverage deprioritized vs. war coverage
    - Succession discussion marginal compared to military narrative
    - Official channels avoided confirming Khamenei death before state TV
    - Activity drop visible between international death reports and official confirmation

  volume_management: |
    High-traffic channels during active operations can generate hundreds of
    messages/day. Raw export will contain massive noise. Pre-filter options:
    1. Manual relevance scan before export (highest quality, lowest scale)
    2. Keyword filter in export script (medium quality, good scale)
    3. Cheap LLM pass (Haiku-tier) against WT watch list (automated, needs testing)
    Recommendation: Start with option 1 for critical channels, option 2 for high-volume channels.
