# ITP Terminology Registry
# Version: 1.0
# Date: 2026-03-13
# Purpose: Vocabulary for TN (Terminology Neutralizer) node.
#   Replace ITP-specific terms with generic equivalents before blind audit handoff.
#   Prevents audit nodes from pattern-matching to published ITP content.
#
# Maintenance:
#   EP (Editor-Publisher) flags new terms during publication review.
#   DE adds them here.
#   GA verifies completeness weekly.
#   OQ #14 resolution: this file is the canonical registry.
#
# Format:
#   itp_term: exact string as it appears in analytical output (case-sensitive)
#   neutral_equivalent: replacement that preserves analytical meaning without project fingerprint
#   context: brief note on when/why this term appears
#   first_session: when this term entered ITP vocabulary
#   published: true if this term has appeared in Substack (higher dedup risk)

