name: sp_source_processor
description: 'Ingest raw source material (text, URLs, Telegram messages) and extract
  structured factual claims with epistemic tags. Output feeds into analyze_intelligence.
  Supports Farsi, Arabic, English, Hebrew, Turkish.

  '
default_tier: local
system_prompt: "You are the ITP Source Processor (SP). Your function is claim extraction,\n\
  not analysis. You convert raw source material into structured, attributed,\nepistemically-tagged\
  \ claim objects.\n\n## What you do\n\nFor each source item in the bundle:\n\n1.\
  \ IDENTIFY LANGUAGE. Tag each item with detected language code\n   (fa, ar, en,\
  \ he, tr). Do not translate. Preserve original text in\n   raw_text field; provide\
  \ normalized English summary in claim_text.\n\n2. EXTRACT CLAIMS. A claim is a discrete,\
  \ falsifiable assertion made by or\n   reported in the source. One source item may\
  \ yield 0–N claims.\n   - DO extract: statements of fact, reported events, stated\
  \ positions\n   - DO NOT extract: editorial opinion framed as fact, unattributable\
  \ rumors,\n     vague atmospheric statements (\"tensions are rising\")\n   - Minimum\
  \ specificity: \"IRGC commander X met with Y on date Z\" YES.\n     \"IRGC is active\"\
  \ NO.\n\n3. ASSIGN SOURCE TIER. Use the source_tier from the source_bundle metadata.\n\
  \   Do not override except for clear mismatches (e.g., official source cited\n \
  \  inside a Tier 4 channel — keep Tier 4 for the channel, note the citation).\n\n\
  4. ASSIGN EPISTEMIC TAG.\n   - [Fact]: Directly stated in Tier 1–2 source, independently\
  \ corroborated\n     by a second source in this bundle\n   - [Inference]: Claim\
  \ logically follows from stated facts but is not directly\n     stated\n   - [Uncertain]:\
  \ Single Tier 3–4 source, or claim is contested\n   - [Speculation]: Claim is plausible\
  \ but lacks evidential basis in this bundle\n\n5. ENTITY TAGGING. Tag recognized\
  \ ITP entities mentioned in each claim using\n   the entity name registry. Use entity_ids\
  \ field. Unknown entities: leave\n   entity_ids empty, add entity_candidates list\
  \ of names for IA review.\n\n6. FORWARD CHAIN FLAG. If claim was forwarded from\
  \ a different channel,\n   note forwarded_from and flag for IA provenance review.\n\
  \n## What you do NOT do\n- Do not assess whether claims are consistent with the\
  \ ITP analytical framework\n- Do not draw conclusions across claims\n- Do not assess\
  \ strategic significance\n- Do not update or suggest updates to any ITP variable\
  \ or observation\n\n## Output\nReturn yaml only. No prose commentary.\n"
knowledge_sources:
- path: /Volumes/Data4TB/Developer/IranTransitionProject/baft/pipeline/config/itp_source_hierarchy.yaml
  inject_as: source_tier_rules
- path: /Volumes/Data4TB/Developer/IranTransitionProject/baft/pipeline/config/itp_epistemic_rules.yaml
  inject_as: epistemic_tagging_rules
- path: /Volumes/Data4TB/Developer/IranTransitionProject/baft/pipeline/config/itp_entity_name_registry.yaml
  inject_as: entity_names
input_schema:
  type: object
  properties:
    source_bundle:
      type: object
      properties:
        generated_at:
          type: string
        items:
          type: array
          items:
            type: object
            properties:
              global_id:
                type: string
              url: {}
              language:
                type: string
              source_tier:
                type: integer
                minimum: 1
                maximum: 5
              faction_tag:
                type: string
              retrieval_date:
                type: string
              raw_text:
                type: string
              normalized_text: {}
              is_forward:
                type: boolean
              forwarded_from: {}
            required:
            - source_tier
            - raw_text
      required:
      - items
  required:
  - source_bundle
output_schema:
  type: object
  properties:
    extracted_claims:
      type: object
      properties:
        processed_at:
          type: string
        source_count:
          type: integer
        claim_count:
          type: integer
        claims:
          type: array
          items:
            type: object
            properties:
              claim_id:
                type: string
              source_global_id:
                type: string
              source_tier:
                type: integer
              faction_tag:
                type: string
              language:
                type: string
              claim_text:
                type: string
              raw_excerpt:
                type: string
              epistemic_tag:
                type: string
                enum:
                - '[Fact]'
                - '[Inference]'
                - '[Uncertain]'
                - '[Speculation]'
              entity_ids:
                type: array
                items:
                  type: string
              entity_candidates:
                type: array
                items:
                  type: string
              is_forward:
                type: boolean
              forwarded_from: {}
              provenance_flag:
                type: boolean
            required:
            - claim_id
            - source_tier
            - claim_text
            - epistemic_tag
        languages_detected:
          type: array
        low_confidence_count:{ type: integer }
      required:
      - claims
      - source_count
      - claim_count
  required:
  - extracted_claims
output_constraints:
  format: yaml_only
  max_tokens: 4000
