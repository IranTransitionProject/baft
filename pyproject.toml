[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baft"
version = "0.1.0"
description = "ITP analytical engine — application layer on the Loom framework"
requires-python = ">=3.11"

dependencies = [
    "loom[mcp,duckdb,rag]",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "structlog>=24.0",
    "click>=8.0",
    "python-dotenv>=1.0",
    "duckdb>=0.10",
    "croniter>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
baft = "baft.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/baft"]

[tool.uv.sources]
loom = { path = "../loom", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests requiring NATS + Redis + LLM backend",
    "unit: unit tests with no external dependencies",
    "e2e: end-to-end smoke tests requiring live infrastructure (NATS + workers)",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "F", "E", "W", "I", "N", "UP", "B", "A", "C4", "SIM",
    "TC", "RUF", "D", "ANN", "PT", "RET", "ARG", "PL",
    "PERF", "LOG", "T20",
]
ignore = [
    "D100", "D104", "D203", "D212", "D105", "D107",
    "ANN401", "ARG002", "PLR0913", "PLR2004",
    "B008", "PLC0415", "T20",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ANN", "ARG", "T20", "PLR", "SIM105", "PT011", "B007", "RUF059", "RUF012", "PERF102", "RET504", "E402"]
"scripts/**/*.py" = ["T20", "ANN", "PLR", "E402"]
"pipeline/scripts/**/*.py" = ["T20", "ANN", "PLR"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.isort]
known-first-party = ["baft"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"
