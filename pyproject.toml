[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "baft"
version = "0.1.0"
description = "ITP analytical engine — application layer on the Loom framework"
requires-python = ">=3.11"

dependencies = [
    "loom[mcp,duckdb,rag]",
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "structlog>=24.0",
    "click>=8.0",
    "python-dotenv>=1.0",
    "duckdb>=0.10",
    "croniter>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
baft = "baft.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/baft"]

[tool.uv.sources]
loom = { path = "../loom", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests requiring NATS + Redis + LLM backend",
    "unit: unit tests with no external dependencies",
    "e2e: end-to-end smoke tests requiring live infrastructure (NATS + workers)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
