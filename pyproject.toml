[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "baft"
version = "0.1.0"
description = "ITP analytical engine — application layer on the Loom framework"
requires-python = ">=3.11"

dependencies = [
    # Loom framework — install from local clone or GitHub
    # pip install -e /path/to/loom[mcp,duckdb,rag]
    # or: loom @ git+https://github.com/IranTransitionProject/loom@main
    "pyyaml>=6.0",
    "pydantic>=2.0",
    "structlog>=24.0",
    "click>=8.0",
    "python-dotenv>=1.0",
    "duckdb>=0.10",
    "croniter>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
]

[project.scripts]
baft = "baft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: end-to-end tests requiring NATS + Redis + LLM backend",
    "unit: unit tests with no external dependencies",
]

[tool.ruff]
line-length = 100
target-version = "py311"
